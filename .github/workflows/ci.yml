name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4   # khuyen nghi: ghim theo commit SHA

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      # Test flaky duoc chay lai toi da 1 lan (until-pass:2). Test pass o lan 2 van la tin hieu can xem.
      # Golden-image compare nen la mot test cua ctest (nguong sai so khai bao trong test, khong trong workflow).
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --repeat until-pass:2 --no-tests=error

      - name: Upload logs and image diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.config }}
          path: |
            build/Testing/**
            build/golden-diff/**
          if-no-files-found: ignore

  # Mot check duy nhat de branch protection yeu cau (khong phu thuoc ten matrix)
  ci-gate:
    needs: build-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "build-test: ${{ needs.build-test.result }}"; exit 1
          fi
