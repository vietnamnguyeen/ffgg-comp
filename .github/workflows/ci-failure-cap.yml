name: CI failure cap

# workflow_run luon chay ban workflow tren nhanh mac dinh (main), khong phai ban trong PR.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  cap:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Dem so lan CI do lien tiep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_FILE: ci.yml
          MAX_RED: "3"
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "Khong gan voi PR nao, bo qua"; exit 0; }

          conclusions=$(gh api -X GET "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs" \
            -f branch="$BRANCH" -f event=pull_request -f status=completed -f per_page=10 \
            --jq '.workflow_runs | map(select(.conclusion != "cancelled")) | .[].conclusion')

          streak=0
          for c in $conclusions; do
            if [ "$c" = "failure" ] || [ "$c" = "timed_out" ]; then streak=$((streak+1)); else break; fi
          done
          echo "Chuoi CI do lien tiep: $streak"

          if [ "$streak" -ge "$MAX_RED" ]; then
            gh label create needs-human --repo "$REPO" --color B60205 \
              --description "Agent phai dung, cho nguoi quyet dinh" 2>/dev/null || true
            gh pr edit "$PR" --repo "$REPO" --add-label needs-human
            gh pr comment "$PR" --repo "$REPO" --body "CI đỏ $streak lần liên tiếp. Dừng vòng tự sửa, cần bạn quyết định (nguyên nhân có thể là lỗi môi trường hoặc test flaky)."
          fi
          # Khong tu go nhan needs-human khi CI xanh lai: nhan nay dung chung cho
          # ca cong CI va cong review-fix; chi ban (nguoi) duoc go nhan.
